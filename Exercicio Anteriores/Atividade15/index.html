<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cursos da Fatec Sorocaba</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Cursos da Fatec Sorocaba</h1>

        <p>Selecione um curso para obter mais informações:</p>

        <select id="curso" onchange="carregarCurso(this.value)">
            <option value="">Selecione um curso</option>

            <option value="ads">
                Análise e Desenvolvimento de Sistemas
            </option>

            <option value="automacao">
                Automação Industrial
            </option>

            <option value="eletronica">
                Eletrônica Automotiva
            </option>

            <option value="fabricacao">
                Fabricação Mecânica
            </option>

            <option value="qualidade">
                Gestão da Qualidade
            </option>

            <option value="empresarial">
                Gestão Empresarial
            </option>

            <option value="logistica">
                Logística
            </option>

            <option value="manufatura">
                Manufatura Avançada
            </option>

            <option value="aeronaves">
                Manutenção de Aeronaves
            </option>

            <option value="polimeros">
                Polímeros
            </option>

            <option value="metalurgicos">
                Processos Metalúrgicos
            </option>

            <option value="projetos">
                Projetos Mecânicos
            </option>

            <option value="biomedicos">
                Sistemas Biomédicos
            </option>
        </select>
    </main>

    <script src="script.js"></script>

</body>

</html>
