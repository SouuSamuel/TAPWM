<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário Principal</title>

    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef3f8;
            color: #1f2937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #1f3c72;
        }

        form {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            padding: 28px 30px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        label,
        p {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            background: #f8fafc;
            color: #0f172a;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        input[type="radio"] {
            margin-right: 8px;
        }

        .radio-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 700;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #ffffff;
        }

        button[type="reset"] {
            background: #e2e8f0;
            color: #0f172a;
            margin-left: 12px;
        }

        button:hover {
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <form name="nomeform" onsubmit="return validar(event)" novalidate>

        <h1>Formulário Principal</h1>

        <label for="nome">Nome:</label><br>
        <input
            type="text"
            id="nome"
            name="nome"
        >

        <br><br>

        <label for="email">E-mail:</label><br>
        <input
            type="email"
            id="email"
            name="email"
        >

        <br><br>

        <label for="comentario">Comentário:</label><br>
        <textarea
            id="comentario"
            name="comentario"
            rows="4"
            cols="40"
        ></textarea>

        <br><br>

        <p>Pesquisa:</p>
        <p>Primeira vez nesta página?</p>

        <input
            type="radio"
            id="sim"
            name="primeira_vez"
            value="sim"
        >
        <label for="sim">Sim</label>

        <br>

        <input
            type="radio"
            id="nao"
            name="primeira_vez"
            value="nao"
        >
        <label for="nao">Não</label>

        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>

    </form>

    <script src="script.js"></script>

</body>

</html>
