<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janela Interativa</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }

        img{
            width: 300px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        img.explodir{
            animation: explodir 0.5s forwards;
        }

        @keyframes explodir{
            0%{
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50%{
                transform: scale(1.3) rotate(15deg);
                opacity: 0.8;
            }
            100%{
                transform: scale(0) rotate(45deg);
                opacity: 0;
            }
        }

        h1{
            color: #333;
        }
    </style>
</head>
<body>

    <h1 id="status">Janela Fechada</h1>

    <img 
        id="janela"
        src="fechada.png"
        alt="Janela"
        onmouseover="abrirJanela()"
        onmouseout="fecharJanela()"
        onclick="quebrarJanela()"
    >

    <script>

        let quebrada = false;

        function abrirJanela() {
            if(!quebrada){
                document.getElementById("janela").src = "aberta.png";
                document.getElementById("status").innerText = "Janela Aberta";
            }
        }

        function fecharJanela() {
            if(!quebrada){
                document.getElementById("janela").src = "fechada.png";
                document.getElementById("status").innerText = "Janela Fechada";
            }
        }

        function quebrarJanela() {
            if (!quebrada) {
                const janela = document.getElementById("janela");
                janela.classList.add("explodir");
                document.getElementById("status").innerText = "Explodindo...";

                setTimeout(function() {
                    janela.classList.remove("explodir");
                    janela.src = "quebrada.png";
                    document.getElementById("status").innerText = "Janela Quebrada";
                    quebrada = true;
                }, 500);
            }
        }

    </script>

</body>
</html>
